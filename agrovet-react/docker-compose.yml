version: "3.8"

services: 
  # Banco de Dados MySQL
  db: 
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment: 
      MYSQL_ROOT_PASSWORD: senhadificilpradedeu123
      MYSQL_DATABASE: meu_banco
    ports: 
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede-interna

  # API Node.js / Express
  backend:
    build: ./backend
    container_name: backend_node
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: senhadificilpradedeu123
      DB_NAME: meu_banco
    depends_on:
      - db
    networks:
      - rede-interna
      - rede-externa

  # Front-end React / Vite
  frontend:
    build: ./frontend
    container_name: frontend_react
    restart: always
    ports:
      - "3000:3000"
    networks:
      - rede-externa

  # Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - rede-interna
      - rede-externa

networks:
  rede-externa:
    driver: bridge
  rede-interna:
    driver: bridge

volumes:
  db_data: